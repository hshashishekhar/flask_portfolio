{% extends "admin_base.html" %}

{% block head %}
{% endblock %}

{% block content %}

  <!-- Form Section -->
  <div class="bg-white p-6 rounded-lg shadow-md mb-6">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">Add New Entry</h2>
    <form class="space-y-4" method="post" action="{{ url_for('user_detail', id=user_info.id) }}">
      <!-- Name and id Fields -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="name" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="name" name="name" value="{{ user_info.username }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="John Doe" required>
        </div>
        <div>
          <label for="id" class="block text-sm font-medium text-gray-700">ID</label>
          <input type="number" id="id" name="id" value="{{ user_info.id }}" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm" placeholder="28" readonly>
        </div>
      </div>

      <!-- Submit Button -->
      <div>
        <button type="submit" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
          Save Changes
        </button>
      </div>
    </form>
</div>
{% endblock %}

{% block footer %}
{% endblock %}
