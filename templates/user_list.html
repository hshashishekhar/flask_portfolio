{% extends "admin_base.html" %}

{% block head %}
{% endblock %}

{% block content %}
<!-- Table Section -->
<div class="table-container">
    <h2>Users</h2>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Password</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                
                <tr>
                    
                        <td>{{ user.id }}</td>
                        <td>{{ user.username }}</td>
                        <td>{{ user.password }}</td>
                        <td>
                            <a href="{{ url_for('user_detail', id=user.id) }}" class="btn modify"><i class="fas fa-edit"></i> Modify</a>
                            <a href="{{ url_for('delete_user', id=user.id) }}" class="btn delete"><i class="fas fa-trash"></i> Delete</a>
                        </td>
                </tr>
                
                {% endfor %}

            </tbody>
        </table>
        <!-- Add User Button -->
        <button class="btn add" onclick="openModal()"><i class="fas fa-plus"></i> Add User</button>
    </div>
</div>


  <!-- Modal Backdrop -->
  <div id="modalBackdrop" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50"></div>

  <!-- Modal -->
  <div id="modal" class="hidden fixed inset-0 flex items-center justify-center z-50">
    <div class="bg-white rounded-lg shadow-lg w-11/12 md:w-1/2 lg:w-1/3 p-6">
      <!-- Modal Header -->
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-xl font-semibold text-gray-800">Add New User</h2>
        <button onclick="closeModal()" class="text-gray-500 hover:text-gray-700 focus:outline-none">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <form class="space-y-4" method="post" action="{{ url_for('add_user')}}">
        <!-- Username Field -->
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="username" id="username" name="username" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your username" required>
        </div>

        <!-- Password Field -->
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="Enter your password" required>
        </div>

        <!-- Submit Button -->
        <div>
          <button type="submit" class="w-full bg-blue-500 text-white py-2 px-4 rounded-md hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            Add User
          </button>
        </div>
      </form>
    </div>
  </div>


{% endblock %}

{% block footer %}
<script>
    function openModal() {
      document.getElementById('modal').classList.remove('hidden');
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal').classList.add('hidden');
      document.getElementById('modalBackdrop').classList.add('hidden');
    }
  </script>
{% endblock %}
